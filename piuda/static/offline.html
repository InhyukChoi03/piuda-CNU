<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d6b54">
  <title>피우다 · 연결 끊김</title>
  <link rel="stylesheet" href="/static/app.css?v=19">
</head>
<body>
  <main class="shell">
    <section class="auth-panel">
      <div class="auth-copy"><p class="eyebrow">연결 끊김</p><h1>피우다에 연결할 수 없어요.</h1><p id="connectionHelp">아이폰과 Raspberry Pi가 켜져 있고 같은 Wi-Fi에 연결되어 있는지 확인한 뒤 다시 시도해 주세요.</p></div>
      <div class="auth-form"><button class="button primary" type="button" onclick="location.reload()">다시 연결</button><a id="setupLink" class="button secondary" href="http://CNU.local:8080/install#call-setup">통화 설정 보기</a></div>
    </section>
  </main>
  <script>
    if (location.protocol === "https:") {
      document.querySelector("#connectionHelp").textContent = "인증서 신뢰 설정과 Wi-Fi를 확인한 뒤 Safari에서 다시 연결해 주세요.";
      document.querySelector("#setupLink").href = `http://${location.hostname}:8080/install#call-setup`;
    }
  </script>
</body>
</html>
